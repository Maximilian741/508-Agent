server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cap request bodies to match the backend MAX_UPLOAD_MB (default 25). Raise
    # both together. Only relevant if this nginx fronts the API (see the
    # commented /api proxy below); in the Cloudflare Tunnel topology, api.*
    # routes straight to backend:8000 and Cloudflare enforces its own limit.
    client_max_body_size 25m;

    # Compress text-y assets.  nginx:alpine ships with gzip on by default
    # but we make it explicit for the bundle.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml application/wasm image/svg+xml font/woff2;

    # Security headers — backend already sets stronger ones for API
    # responses, but we cover the static surface here too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Hashed assets get the immutable treatment.  Expo's web bundle emits
    # filenames like ``main.<hash>.js`` and stages them under ``static/``
    # or ``_expo/``; treat both the same way.
    location ~* \.(js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|webp|ico|map)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html and the root document must NEVER be cached — that's how
    # we ensure clients pull the latest hash references on every refresh.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
        try_files $uri =404;
    }

    # OPTIONAL reverse proxy to the backend, for topologies where nginx fronts
    # the API instead of Cloudflare Tunnel routing api.* -> backend:8000
    # directly. Uncomment and point proxy_pass at your uvicorn upstream.
    # location /api/ {
    #     proxy_pass http://backend:8000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # SPA fallback: any unmatched path delivers index.html so client-side
    # routing (expo-router) can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
