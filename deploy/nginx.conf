# REFERENCE config for serving the static export from your own nginx.
#
# The Docker image does NOT use this file: frontend/frontend/Dockerfile
# generates its config with scripts/render-nginx-conf.mjs, which also emits a
# Content-Security-Policy whose inline-script hashes match the exact bundle.
# If you serve the export yourself, prefer running that script against your
# dist/ and using its output. This file keeps the two things that matter most
# if you can't: correct routing and headers that survive nginx inheritance.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Cap request bodies to match the backend MAX_UPLOAD_MB (default 25). Raise
    # both together. Only relevant if this nginx fronts the API (see the
    # commented /api proxy below); in the Cloudflare Tunnel topology, api.*
    # routes straight to backend:8000 and Cloudflare enforces its own limit.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml application/wasm image/svg+xml font/woff2;

    error_page 404 /+not-found.html;

    # NOTE: nginx discards server-level add_header in any location that
    # declares its own add_header. That is why every location below repeats
    # the security headers — the previous version of this file set them once
    # at server level, and index.html went out without X-Frame-Options.

    # Content-hashed build output: cache forever.
    location ^~ /_expo/static/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ^~ /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Dynamic routes: serve the exported shell for the route.
    location ^~ /share/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html "/share/[id].html";
    }
    location ^~ /issue/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html "/issue/[id].html";
    }

    # OPTIONAL reverse proxy to the backend, for topologies where nginx fronts
    # the API instead of Cloudflare Tunnel routing api.* -> backend:8000
    # directly. Uncomment and point proxy_pass at your uvicorn upstream.
    # location /api/ {
    #     proxy_pass http://backend:8000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Every other route is a real exported file: /pricing -> pricing.html.
    # (The old `try_files $uri $uri/ /index.html` answered every URL with the
    # dashboard's HTML, hiding each page's own title and description.)
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/index.html =404;
    }
}
