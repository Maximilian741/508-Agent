version: "3.9"

# ============================================================================
# 508 Agent - production-style single-VPS topology
# ============================================================================
#   * db         - postgres:16-alpine, persisted to a named volume
#   * backend    - FastAPI (uvicorn, 2 workers), depends on db, reads .env
#   * frontend   - nginx serving the Expo Router web bundle on :8080
#   * cloudflared - OPTIONAL Cloudflare Tunnel daemon (commented out by
#                   default; uncomment + supply CF_TUNNEL_TOKEN in .env to
#                   route public traffic without binding host ports).
#
# The legacy "dev" profile (postgres-on-host-port + minio + minio-init) is
# preserved at the bottom so existing `docker compose --profile dev up` flows
# keep working for local development against an S3-compatible bucket.
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - generate a strong value, see deploy/.env.example}
      POSTGRES_DB: ${POSTGRES_DB:-agentdb}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agentdb}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required - see .env.example}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agentdb}}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_ROOT: /app/.runtime/storage
      MATERIALIZED_ROOT: /app/.runtime/materialized
      AWS_REGION: ${AWS_REGION:-auto}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-508-agent}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_FORCE_PATH_STYLE: "true"
      PRESIGN_EXPIRES_SECONDS: 3600
      ENABLE_DEV_STORAGE_ENDPOINT: "false"
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8080}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-}
      CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_AUD:-}
      PIPELINE_ARTIFACT_TTL_SECONDS: ${PIPELINE_ARTIFACT_TTL_SECONDS:-86400}
    volumes:
      - backend_runtime:/app/.runtime
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/frontend/Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:?EXPO_PUBLIC_API_URL is required - the public backend URL the web app calls, e.g. https://api.example.com}
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # Cloudflare Tunnel (OPTIONAL)
  # --------------------------------------------------------------------------
  # Uncomment the block below to route public traffic to backend/frontend
  # through a Cloudflare Tunnel (no host ports needed, integrates with
  # Cloudflare Access for SSO).
  #
  #   1. Create a tunnel in the Cloudflare dashboard (Zero Trust > Networks >
  #      Tunnels) and copy the tunnel token.
  #   2. Put it in `.env` as CF_TUNNEL_TOKEN=eyJh...
  #   3. Add public hostnames in the dashboard pointing at:
  #        - https://api.example.com  -> http://backend:8000
  #        - https://app.example.com  -> http://frontend:8080
  #   4. Uncomment the service and `docker compose up -d cloudflared`.
  # --------------------------------------------------------------------------
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
  #   environment:
  #     TUNNEL_METRICS: "0.0.0.0:2000"
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #     frontend:
  #       condition: service_healthy

  # ---- Local development extras (profile: dev) -----------------------------
  postgres:
    image: postgres:16
    profiles: ["dev"]
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agentdb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agentdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    profiles: ["dev"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    profiles: ["dev"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/508-agent-dev &&
      mc anonymous set none local/508-agent-dev
      "

volumes:
  db_data:
  pg_data:
  backend_runtime:
  minio_data:
