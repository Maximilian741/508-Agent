version: "3.9"

# Single-VPS deployment topology:
#   * backend   — FastAPI app, exposed only inside the compose network
#   * frontend  — nginx serving the Expo web bundle, exposed only inside the network
#   * cloudflared — Cloudflare Tunnel daemon that routes public traffic to the
#                   above services after Cloudflare Access has authenticated
#                   the user.  No public ports are bound on the host.
#
# Local-dev extras (postgres + minio) are gated behind the ``dev`` profile so
# that ``docker compose up -d`` on a production VPS doesn't drag them in.
# Run ``docker compose --profile dev up -d`` to get the full local stack.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required - see deploy/.env.example}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/.runtime/508_agent.db}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      STORAGE_LOCAL_ROOT: /app/.runtime/storage
      MATERIALIZED_ROOT: /app/.runtime/materialized
      AWS_REGION: ${AWS_REGION:-auto}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-508-agent}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_FORCE_PATH_STYLE: "true"
      PRESIGN_EXPIRES_SECONDS: 3600
      ENABLE_DEV_STORAGE_ENDPOINT: "false"
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-https://app.example.com}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-}
      CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_AUD:-}
      PIPELINE_ARTIFACT_TTL_SECONDS: ${PIPELINE_ARTIFACT_TTL_SECONDS:-86400}
    volumes:
      - backend_runtime:/app/.runtime
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/frontend/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    environment:
      TUNNEL_METRICS: "0.0.0.0:2000"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  # ---- Local development extras (profile: dev) -----------------------------
  postgres:
    image: postgres:16
    profiles: ["dev"]
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agentdb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agentdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    profiles: ["dev"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    profiles: ["dev"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/508-agent-dev &&
      mc anonymous set none local/508-agent-dev
      "

volumes:
  pg_data:
  backend_runtime:
  minio_data:
