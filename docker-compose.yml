version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agentdb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agentdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: development
      APP_VERSION: 0.1.0
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agentdb
      STORAGE_PROVIDER: s3
      STORAGE_LOCAL_ROOT: /app/.runtime/storage
      MATERIALIZED_ROOT: /app/.runtime/materialized
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: 508-agent-dev
      S3_PREFIX: 508-agent
      S3_ENDPOINT_URL: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      PRESIGN_EXPIRES_SECONDS: 3600
      ENABLE_DEV_STORAGE_ENDPOINT: "true"
      CORS_ALLOW_ORIGINS: http://localhost:8081,http://127.0.0.1:8081,http://localhost:3000,http://127.0.0.1:3000
      MAX_UPLOAD_MB: 25
    ports:
      - "8000:8000"
    volumes:
      - backend_runtime:/app/.runtime
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/508-agent-dev &&
      mc anonymous set none local/508-agent-dev
      "

volumes:
  pg_data:
  backend_runtime:
  minio_data:
