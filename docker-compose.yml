version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agentdb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: development
      APP_VERSION: 0.1.0
      DATABASE_URL: sqlite:///./.runtime/508_agent.db
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_ROOT: /app/.runtime/storage
      CORS_ALLOW_ORIGINS: http://localhost:8081,http://127.0.0.1:8081,http://localhost:3000,http://127.0.0.1:3000
      MAX_UPLOAD_MB: 25
    ports:
      - "8000:8000"
    volumes:
      - backend_runtime:/app/.runtime
    depends_on:
      - postgres

volumes:
  pg_data:
  backend_runtime:
